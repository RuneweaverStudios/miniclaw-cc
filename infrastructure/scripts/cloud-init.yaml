#cloud-config
#
# Cloud-init configuration for Miniclaw Infrastructure
# This script configures base system settings for OpenClaw/Nanobot deployment
#

# Set timezone and locale
timezone: UTC
locale: en_US.UTF-8

# Package updates and installations
package_update: true
package_upgrade: true
package_reboot_if_required: false

# Install required packages
packages:
  - curl
  - wget
  - git
  - vim
  - ufw
  - fail2ban
  - docker.io
  - docker-compose
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - build-essential
  - python3
  - python3-pip
  - nodejs
  - npm
  - htop
  - net-tools
  - unzip

# Users configuration
users:
  - name: openclaw
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo, docker
    lock_passwd: false
    passwd: $6$rounds=4096$openclaw$5B4S8j/9hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8

  - name: nanobot
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo, docker
    lock_passwd: false
    passwd: $6$rounds=4096$nanobot$5B4S8j/9hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8hKj8

# SSH key configuration
ssh_authorized_keys:
  - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... openclaw@miniclaw

# Disable password authentication and root login
ssh_pwauth: false
disable_root: true

# Write SSH configuration
write_files:
  - path: /etc/ssh/sshd_config.d/99-security.conf
    content: |
      # Security hardening for SSH
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
      Protocol 2
      LogLevel VERBOSE
    owner: root:root
    permissions: '0644'

  - path: /etc/ufw/before.rules
    content: |
      #
      # rules.before
      #
      # Start with empty rules
      *filter
      :ufw-before-input - [0:0]
      :ufw-before-output - [0:0]
      :ufw-before-forward - [0:0]

      # Allow all on loopback
      -A ufw-before-input -i lo -j ACCEPT
      -A ufw-before-output -o lo -j ACCEPT

      # Allow established connections
      -A ufw-before-input -m state --state RELATED,ESTABLISHED -j ACCEPT

      # Drop invalid packets
      -A ufw-before-input -m state --state INVALID -j DROP

      # Allow ping
      -A ufw-before-input -p icmp --icmp-type echo-request -j ACCEPT

      COMMIT
    owner: root:root
    permissions: '0640'

  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      # Ban hosts for one hour:
      bantime = 3600
      # A host is banned if it has failed 5 attempts:
      findtime = 600
      maxretry = 5
      # Use ufw for firewall
      banaction = ufw
      # Send mail notifications
      destemail = admin@minicaw.local
      sendername = Fail2Ban
      sender = fail2ban@miniclaw.local
      # Enable logging
      logpath = /var/log/auth.log

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3

      [nginx-http-auth]
      enabled = true
      filter = nginx-http-auth
      logpath = /var/log/nginx/error.log
      maxretry = 5
    owner: root:root
    permissions: '0644'

  - path: /etc/sysctl.d/99-security.conf
    content: |
      # IP Spoofing protection
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.rp_filter = 1

      # Ignore ICMP broadcast requests
      net.ipv4.icmp_echo_ignore_broadcasts = 1

      # Disable source packet routing
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0

      # Ignore send redirects
      net.ipv4.conf.all.send_redirects = 0

      # Block SYN attacks
      net.ipv4.tcp_max_syn_backlog = 2048
      net.ipv4.tcp_synack_retries = 2
      net.ipv4.tcp_syn_retries = 5

      # Log Martians
      net.ipv4.conf.all.log_martians = 1

      # Ignore ICMP redirects
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0

      # Ignore Directed Pings
      net.ipv4.icmp_echo_ignore_all = 0
    owner: root:root
    permissions: '0644'

# Run commands on first boot
runcmd:
  # Update system configuration
  - sysctl -p /etc/sysctl.d/99-security.conf

  # Configure firewall (UFW)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 3000/tcp  # OpenClaw default port
  - ufw allow 8000/tcp  # Nanobot default port
  - ufw allow 8080/tcp  # API port
  - ufw allow 9090/tcp  # Worker port
  - ufw --force enable

  # Restart SSH with new configuration
  - systemctl restart sshd

  # Enable and start Fail2Ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Enable and start Docker
  - systemctl enable docker
  - systemctl start docker

  # Add users to docker group
  - usermod -aG docker openclaw
  - usermod -aG docker nanobot

  # Create application directories
  - mkdir -p /opt/openclaw
  - mkdir -p /opt/nanobot
  - mkdir -p /var/log/miniclaw
  - mkdir -p /etc/miniclaw

  # Set directory permissions
  - chown -R openclaw:openclaw /opt/openclaw
  - chown -R nanobot:nanobot /opt/nanobot
  - chown -R root:root /etc/miniclaw
  - chmod -R 755 /opt/openclaw
  - chmod -R 755 /opt/nanobot
  - chmod -R 755 /etc/miniclaw

  # Create log directories
  - touch /var/log/miniclaw/openclaw.log
  - touch /var/log/miniclaw/nanobot.log
  - chown openclaw:openclaw /var/log/miniclaw/openclaw.log
  - chown nanobot:nanobot /var/log/miniclaw/nanobot.log

  # Set up log rotation
  - |
    cat > /etc/logrotate.d/miniclaw << 'EOF'
    /var/log/miniclaw/*.log {
        daily
        missingok
        rotate 14
        compress
        delaycompress
        notifempty
        create 0640 openclaw openclaw
        sharedscripts
        postrotate
            systemctl reload openclaw >/dev/null 2>&1 || true
            systemctl reload nanobot >/dev/null 2>&1 || true
        endscript
    }
    EOF

  # Install Node.js 20.x
  - |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    apt-get install -y nodejs

  # Install Python 3.11
  - |
    add-apt-repository ppa:deadsnakes/ppa -y
    apt-get update
    apt-get install -y python3.11 python3.11-venv python3.11-dev

  # Create swap file for better memory management
  - |
    fallocate -l 2G /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Set sysctl parameters for performance
  - |
    cat > /etc/sysctl.d/99-performance.conf << 'EOF'
    # Increase file descriptor limits
    fs.file-max = 2097152

    # Increase TCP buffer sizes
    net.core.rmem_max = 16777216
    net.core.wmem_max = 16777216
    net.ipv4.tcp_rmem = 4096 87380 16777216
    net.ipv4.tcp_wmem = 4096 65536 16777216

    # Enable TCP Fast Open
    net.ipv4.tcp_fastopen = 3

    # Optimize for high throughput
    net.core.netdev_max_backlog = 5000
    net.ipv4.tcp_max_syn_backlog = 8192

    # Reduce TCP keepalive
    net.ipv4.tcp_keepalive_time = 600
    net.ipv4.tcp_keepalive_intvl = 30
    net.ipv4.tcp_keepalive_probes = 3
    EOF
    sysctl -p /etc/sysctl.d/99-performance.conf

  # Clean up apt cache
  - apt-get clean
  - rm -rf /var/lib/apt/lists/*

# Final message
final_message: "Miniclaw infrastructure base system setup complete!"
