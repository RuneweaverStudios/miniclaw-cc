services:
  # Frontend Service
  - type: web
    name: miniclaw-web
    env: static
    region: oregon
    plan: starter
    buildCommand: cd apps/web && pnpm install && pnpm build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://miniclaw-api.onrender.com

  # API Service
  - type: web
    name: miniclaw-api
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      npm install -g pnpm
      pnpm install --filter @miniclaw/api --filter @miniclaw/shared --filter @miniclaw/config
    startCommand: cd apps/api && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REDIS_URL
        value: redis://red-d6i7i9rh46gs73em43q0:6379
      - key: DATABASE_URL
        sync: false
      - key: DIGITALOCEAN_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://miniclaw-web.onrender.com
      - key: API_URL
        value: https://miniclaw-api.onrender.com
      - key: POOL_TARGET_SIZE
        value: 10
      - key: POOL_MIN_SIZE
        value: 4
      - key: POOL_MAX_SIZE
        value: 20
      - key: POOL_HEALTH_CHECK_INTERVAL
        value: 30000
      - key: WORKER_CONCURRENT_JOBS
        value: 5
      - key: CORS_ORIGIN
        value: https://miniclaw-web.onrender.com
    healthCheckPath: /health

  # Redis Service
  - type: redis
    name: miniclaw-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Only allow internal connections
